const $=id=>document.getElementById(id);const home=$("homeScreen"),exam=$("examScreen"),results=$("results"),status=$("status"),app=$("app");
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function renderTimer(){const m=String(Math.floor(remaining/60)).padStart(2,"0"),s=String(remaining%60).padStart(2,"0");$("timer").textContent=`${m}:${s}`;app.classList.toggle("time-up",remaining<=0)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;$("startBtn").textContent="タイマー開始"}
function resetTimer(){stopTimer();remaining=mode.seconds;renderTimer();status.textContent=`タイマーを${mode.seconds/60}分に戻しました`}
function toggleLabel(){return mode===MODES.key?(showDetails?"所属経脈・要穴を隠す":"所属経脈・要穴を表示"):(showDetails?"所属経脈を隠す":"所属経脈を表示")}
function drawPoints(){if(mode===MODES.manual){const p=shuffled(mode.points)[0];results.innerHTML=`<div class="test-card"><div class="test-hint">検査法名</div><div class="test-name">${escapeHtml(p.name)}</div><button id="revealAnswer" class="answer-btn" type="button">解答を表示</button><div id="manualAnswer" class="test-answer hidden"><div class="test-answer-label">陽性所見</div><div class="test-answer-value">${escapeHtml(p.finding)}</div><div class="test-answer-label">陽性時疾患名</div><div class="test-answer-value">${escapeHtml(p.disease)}</div></div></div>`;$("revealAnswer").addEventListener("click",()=>{$("manualAnswer").classList.toggle("hidden");$("revealAnswer").textContent=$("manualAnswer").classList.contains("hidden")?"解答を表示":"解答を隠す"});status.textContent="解答を考えてから表示ボタンを押してください";return}if(mode===MODES.kata){const cats=shuffled(["腰痛","五十肩","膝痛"]).slice(0,2);const qs=[...cats.map(c=>({category:c,text:shuffled(mode.questions[c])[0]})),{category:"腹診",text:shuffled(mode.questions["腹診"])[0]}];results.innerHTML=qs.map((q,i)=>`<div class="question-card"><div class="question-cat">${i+1}. ${escapeHtml(q.category)}</div><div class="question-text">${escapeHtml(q.text)}</div></div>`).join("");status.textContent="区分の重複なしで3問を抽選しました";if(navigator.vibrate)navigator.vibrate(30);return}const selected=shuffled(mode.points).slice(0,mode.count);results.innerHTML=selected.map((p,i)=>`<div class="row"><div class="num">${i+1}</div><div class="point"><div class="name-line"><div class="name">${escapeHtml(p.name)}</div>${p.key?`<div class="key-type details ${showDetails?'':'hidden'}">${escapeHtml(p.key)}</div>`:''}</div><div class="details ${showDetails?'':'hidden'}"><div>${escapeHtml(p.meridian)}</div></div></div></div>`).join("");status.textContent=`重複なしで${mode.count}穴を抽選しました`;if(navigator.vibrate)navigator.vibrate(30)}
function openMode(id){stopTimer();mode=MODES[id];showDetails=true;home.classList.remove("active");exam.classList.add("active");$("modeTitle").textContent=mode.title;$("modeSub").textContent=mode.sub;const isKata=mode===MODES.kata;const isManual=mode===MODES.manual;$("drawBtn").textContent=isManual?"次の問題を出題":isKata?"3問を再抽選する":`${mode.count}穴を再抽選する`;$("toggleBtn").classList.toggle("hidden",isKata||isManual);$("fullscreenBtn").classList.remove("hidden");document.querySelector(".timer-box").classList.toggle("hidden",isKata);$("note").innerHTML=mode.note;if(!isKata){$("toggleBtn").textContent=toggleLabel();$("resetBtn").textContent=`${mode.seconds/60}分に戻す`;remaining=mode.seconds;renderTimer()}else{remaining=0;app.classList.remove("time-up")}drawPoints();window.scrollTo(0,0)}
function goHome(){stopTimer();exam.classList.remove("active");home.classList.add("active");mode=null;status.textContent="";window.scrollTo(0,0)}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>openMode(b.dataset.mode)));$("backBtn").addEventListener("click",goHome);$("drawBtn").addEventListener("click",drawPoints);$("toggleBtn").addEventListener("click",()=>{showDetails=!showDetails;document.querySelectorAll(".details").forEach(el=>el.classList.toggle("hidden",!showDetails));$("toggleBtn").textContent=toggleLabel();});$("startBtn").addEventListener("click",()=>{if(timerId){stopTimer();status.textContent="タイマーを一時停止しました";return}if(remaining<=0)remaining=mode.seconds;app.classList.remove("time-up");$("startBtn").textContent="一時停止";status.textContent="タイマーを開始しました";timerId=setInterval(()=>{remaining--;renderTimer();if(remaining<=0){stopTimer();status.textContent=`${mode.seconds/60}分経過しました`;if(navigator.vibrate)navigator.vibrate([250,100,250]);alert(`${mode.seconds/60}分経過しました`)}},1000)});$("resetBtn").addEventListener("click",resetTimer);$("fullscreenBtn").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){status.textContent="このブラウザでは全画面表示に対応していません"}});
</script>
</body></html>
