<style>
:root{--navy:#1f4e78;--navy2:#173c5d;--line:#b7c9d9;--paper:#f4f7fa;--text:#17212b;--muted:#586b7b;--accent:#f3b64b;--accent-dark:#c68e27;--green:#e3f1dd;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}.app{width:min(800px,100%);margin:0 auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:20px 16px;border-radius:17px;text-align:center;box-shadow:0 6px 18px rgba(24,61,92,.2)}h1{margin:0;font-size:clamp(25px,6vw,36px);letter-spacing:.04em}.sub{margin-top:7px;opacity:.9;font-size:14px}.screen{display:none}.screen.active{display:block}.menu{display:grid;gap:16px;margin-top:18px}.mode-card{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 12px rgba(24,61,92,.08);cursor:pointer}.mode-card:active{transform:translateY(2px)}.mode-title{font-size:clamp(22px,5vw,29px);font-weight:800;color:var(--navy);line-height:1.3}.mode-info{margin-top:10px;color:var(--muted);line-height:1.7;font-size:15px}.mode-badge{display:inline-block;margin-top:12px;padding:6px 11px;border-radius:999px;background:var(--green);font-weight:700;color:#31552c}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}button{appearance:none;border:none;border-radius:14px;min-height:56px;padding:12px 13px;font-size:17px;font-weight:750;cursor:pointer;touch-action:manipulation}.primary{grid-column:1/-1;background:var(--accent);color:#2b210e;font-size:22px;min-height:66px;box-shadow:0 4px 0 var(--accent-dark)}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.back{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);min-height:42px;padding:7px 13px;font-size:14px;margin-bottom:10px}.timer-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;text-align:center}.timer{font-variant-numeric:tabular-nums;font-size:clamp(46px,13vw,74px);font-weight:850;color:var(--navy);line-height:1;margin:5px 0 12px}.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.results{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.row{display:grid;grid-template-columns:48px 1fr;align-items:center;min-height:76px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}.num{font-weight:850;font-size:20px;text-align:center;color:var(--navy)}.point{padding:11px 14px;border-left:1px solid var(--line)}.name-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.name{font-size:clamp(24px,6.7vw,34px);font-weight:850;line-height:1.15}.key-type{font-size:clamp(14px,3.8vw,18px);font-weight:700;color:#344f65;line-height:1.4;flex:1;min-width:180px}.details{margin-top:5px;font-size:15px;color:#526575;line-height:1.45}.hidden{display:none!important}.note{margin-top:14px;padding:13px 15px;border-radius:14px;background:var(--green);font-size:14px;line-height:1.65}.status{text-align:center;min-height:24px;margin-top:10px;font-size:13px;color:#617282}.question-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.question-cat{font-weight:850;color:var(--navy);font-size:18px;margin-bottom:8px}.question-text{font-size:clamp(18px,4.8vw,23px);font-weight:650;line-height:1.65}.no-timer{margin-top:14px}.footer-note{margin:18px 4px 0;text-align:center;color:#73828f;font-size:12px}.time-up .timer{color:#9b2c2c}.time-up .timer-box{border:2px solid #9b2c2c}@media (orientation:landscape) and (max-height:650px){.app{width:min(1050px,100%)}header{padding:10px}.timer-box{padding:8px}.timer{font-size:43px}.row{min-height:57px}.name{font-size:24px}.controls{margin:8px 0}.primary{min-height:54px}}
.test-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 16px;margin-top:14px;text-align:center}.test-name{font-size:clamp(28px,7vw,40px);font-weight:850;color:var(--navy);margin:14px 0 24px}.test-answer{text-align:left;background:#eef4f8;border-radius:12px;padding:16px;margin-top:18px;line-height:1.7}.test-answer-label{font-size:14px;color:#526575;font-weight:700}.test-answer-value{font-size:clamp(18px,5vw,23px);font-weight:750;margin-bottom:12px;white-space:pre-wrap}.answer-btn{width:100%;background:var(--accent);color:#2b210e}.test-hint{color:#526575;font-size:14px}</style>
<style>
#writtenScreen{display:none}#writtenScreen.active{display:block}#writtenScreen .wcontrols{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}#writtenScreen .wcontrols button{flex:1;min-width:130px;font-size:15px}#writtenScreen .wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}#writtenScreen .wcell{background:white;border:1px solid #b7c9d9;border-radius:12px;overflow:hidden}#writtenScreen .wlabel{background:#eef4f8;color:#1f4e78;font-weight:750;padding:8px;font-size:13px}#writtenScreen .wanswer{width:100%;background:#fff;min-height:82px;padding:12px 8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:17px}#writtenScreen .wanswer.masked{background:#1f4e78;color:white}#writtenScreen .wanswer.masked::after{content:'タップして表示';font-size:12px;display:block;opacity:.8}#writtenScreen .wsetting{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#fff;border-radius:12px}#writtenScreen .wsetting label{padding:5px 8px;font-size:13px;white-space:nowrap}#writtenScreen .wsetting input{accent-color:#1f4e78}#writtenScreen .wsmall{color:#526575;font-size:13px;margin:10px 0}#writtenScreen select{font-size:17px;padding:12px;border-radius:10px;max-width:100%;border:1px solid #b7c9d9}

/* 神経根障害：6項目を横一列に固定し、各セル内で読みやすく折り返す */
#writtenScreen .wgrid.nerve-row{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:8px;min-width:1090px;align-items:stretch}
#writtenScreen .nerve-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;max-width:100%;scrollbar-width:thin}
#writtenScreen .nerve-row .wcell{display:flex;flex-direction:column;min-width:0}
#writtenScreen .nerve-row .wlabel{min-height:65px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4;overflow-wrap:normal;word-break:normal}
#writtenScreen .nerve-row .wanswer{flex:1;min-height:140px;text-align:left;white-space:pre-line;overflow-wrap:anywhere;word-break:normal;line-height:1.65;font-size:15px;padding:12px}
#writtenScreen .nerve-row .wanswer.masked{text-align:center}

/* 神経根障害：横スクロールなし・可変幅6列 */
#writtenScreen .nerve-scroll{overflow-x:visible;padding-bottom:0;width:100%}
#writtenScreen .wgrid.nerve-row{width:100%;min-width:0;grid-template-columns:minmax(0,1.25fr) minmax(0,.78fr) minmax(0,.76fr) minmax(0,1.12fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:4px}
#writtenScreen .nerve-row .wcell{min-width:0;overflow:hidden}
#writtenScreen .nerve-row .wlabel{min-height:75px;font-size:clamp(9px,1.9vw,12px);padding:5px 2px;overflow-wrap:anywhere;word-break:normal;line-height:1.35}
#writtenScreen .nerve-row .wanswer{min-height:120px;font-size:clamp(10px,2.15vw,14px);padding:7px 3px;overflow-wrap:anywhere;word-break:normal;line-height:1.5}
@media(max-width:480px){#writtenScreen .wgrid.nerve-row{gap:2px}#writtenScreen .nerve-row .wlabel{font-size:9px;padding:4px 1px}#writtenScreen .nerve-row .wanswer{font-size:10px;padding:5px 2px}}

/* 暗記範囲の3択タブ：選択中を濃紺＋白文字で強調 */
#writtenScreen .w-tabs{display:grid;grid-template-columns:1.25fr .8fr .9fr;gap:5px;width:100%;flex:1 1 100%;}
#writtenScreen .w-tab{min-width:0;min-height:55px;padding:9px 4px;font-size:clamp(11px,2.7vw,16px);line-height:1.35;border:2px solid #a8bed0;background:#fff;color:#1f4e78;border-radius:11px;box-shadow:none;}
#writtenScreen .w-tab.active{background:#1f4e78;color:#fff;border-color:#1f4e78;box-shadow:inset 0 -3px 0 #f3b64b;}
#writtenScreen .w-tab:focus-visible{outline:3px solid #f3b64b;outline-offset:2px;}

/* 筋の起始・停止：5項目を画面内で横並び表示 */
#writtenScreen .wgrid.muscle-row{grid-template-columns:minmax(0,1.08fr) minmax(0,1.35fr) minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.45fr);gap:4px;width:100%;}
#writtenScreen .muscle-row .wcell{min-width:0;display:flex;flex-direction:column;}
#writtenScreen .muscle-row .wlabel{text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;padding:6px 2px;font-size:clamp(10px,2.1vw,13px);}
#writtenScreen .muscle-row .wanswer{flex:1;min-height:120px;padding:8px 3px;font-size:clamp(10px,2.4vw,15px);line-height:1.5;overflow-wrap:anywhere;word-break:normal;}
@media(max-width:480px){#writtenScreen .wgrid.muscle-row{gap:2px}#writtenScreen .muscle-row .wlabel{font-size:10px;padding:4px 1px}#writtenScreen .muscle-row .wanswer{font-size:11px;padding:6px 2px}}
</style></head>
<body>
<main class="app" id="app">
<section id="homeScreen" class="screen active">
<header><h1>2026年度実技練習</h1><div class="sub">試験モードを選択してください</div></header>
<div class="menu">

let mode=null,showDetails=true,remaining=0,timerId=null;
const $=id=>document.getElementById(id);const home=$("homeScreen"),exam=$("examScreen"),results=$("results"),status=$("status"),app=$("app");
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function renderTimer(){const m=String(Math.floor(remaining/60)).padStart(2,"0"),s=String(remaining%60).padStart(2,"0");$("timer").textContent=`${m}:${s}`;app.classList.toggle("time-up",remaining<=0)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;$("startBtn").textContent="タイマー開始"}
function resetTimer(){stopTimer();remaining=mode.seconds;renderTimer();status.textContent=`タイマーを${mode.seconds/60}分に戻しました`}
function toggleLabel(){return mode===MODES.key?(showDetails?"所属経脈・要穴を隠す":"所属経脈・要穴を表示"):(showDetails?"所属経脈を隠す":"所属経脈を表示")}
function drawPoints(){if(mode===MODES.manual){const p=shuffled(mode.points)[0];results.innerHTML=`<div class="test-card"><div class="test-hint">検査法名</div><div class="test-name">${escapeHtml(p.name)}</div><button id="revealAnswer" class="answer-btn" type="button">解答を表示</button><div id="manualAnswer" class="test-answer hidden"><div class="test-answer-label">陽性所見</div><div class="test-answer-value">${escapeHtml(p.finding)}</div><div class="test-answer-label">陽性時疾患名</div><div class="test-answer-value">${escapeHtml(p.disease)}</div></div></div>`;$("revealAnswer").addEventListener("click",()=>{$("manualAnswer").classList.toggle("hidden");$("revealAnswer").textContent=$("manualAnswer").classList.contains("hidden")?"解答を表示":"解答を隠す"});status.textContent="解答を考えてから表示ボタンを押してください";return}if(mode===MODES.kata){const cats=shuffled(["腰痛","五十肩","膝痛"]).slice(0,2);const qs=[...cats.map(c=>({category:c,text:shuffled(mode.questions[c])[0]})),{category:"腹診",text:shuffled(mode.questions["腹診"])[0]}];results.innerHTML=qs.map((q,i)=>`<div class="question-card"><div class="question-cat">${i+1}. ${escapeHtml(q.category)}</div><div class="question-text">${escapeHtml(q.text)}</div></div>`).join("");status.textContent="区分の重複なしで3問を抽選しました";if(navigator.vibrate)navigator.vibrate(30);return}const selected=shuffled(mode.points).slice(0,mode.count);results.innerHTML=selected.map((p,i)=>`<div class="row"><div class="num">${i+1}</div><div class="point"><div class="name-line"><div class="name">${escapeHtml(p.name)}</div>${p.key?`<div class="key-type details ${showDetails?'':'hidden'}">${escapeHtml(p.key)}</div>`:''}</div><div class="details ${showDetails?'':'hidden'}"><div>${escapeHtml(p.meridian)}</div></div></div></div>`).join("");status.textContent=`重複なしで${mode.count}穴を抽選しました`;if(navigator.vibrate)navigator.vibrate(30)}
function openMode(id){stopTimer();mode=MODES[id];showDetails=true;home.classList.remove("active");exam.classList.add("active");$("modeTitle").textContent=mode.title;$("modeSub").textContent=mode.sub;const isKata=mode===MODES.kata;const isManual=mode===MODES.manual;$("drawBtn").textContent=isManual?"次の問題を出題":isKata?"3問を再抽選する":`${mode.count}穴を再抽選する`;$("toggleBtn").classList.toggle("hidden",isKata||isManual);$("fullscreenBtn").classList.remove("hidden");document.querySelector(".timer-box").classList.toggle("hidden",isKata);$("note").innerHTML=mode.note;if(!isKata){$("toggleBtn").textContent=toggleLabel();$("resetBtn").textContent=`${mode.seconds/60}分に戻す`;remaining=mode.seconds;renderTimer()}else{remaining=0;app.classList.remove("time-up")}drawPoints();window.scrollTo(0,0)}
function goHome(){stopTimer();exam.classList.remove("active");home.classList.add("active");mode=null;status.textContent="";window.scrollTo(0,0)}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>openMode(b.dataset.mode)));$("backBtn").addEventListener("click",goHome);$("drawBtn").addEventListener("click",drawPoints);$("toggleBtn").addEventListener("click",()=>{showDetails=!showDetails;document.querySelectorAll(".details").forEach(el=>el.classList.toggle("hidden",!showDetails));$("toggleBtn").textContent=toggleLabel();});$("startBtn").addEventListener("click",()=>{if(timerId){stopTimer();status.textContent="タイマーを一時停止しました";return}if(remaining<=0)remaining=mode.seconds;app.classList.remove("time-up");$("startBtn").textContent="一時停止";status.textContent="タイマーを開始しました";timerId=setInterval(()=>{remaining--;renderTimer();if(remaining<=0){stopTimer();status.textContent=`${mode.seconds/60}分経過しました`;if(navigator.vibrate)navigator.vibrate([250,100,250]);alert(`${mode.seconds/60}分経過しました`)}},1000)});$("resetBtn").addEventListener("click",resetTimer);$("fullscreenBtn").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){status.textContent="このブラウザでは全画面表示に対応していません"}});
